<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="shell">
    <header class="top">
      <a class="brand" href="{{ url_for('index') }}">Expense Tracker</a>
      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Expenses</a>
        <a href="{{ url_for('report') }}"{% if request.endpoint == 'report' %} aria-current="page"{% endif %}>Monthly report</a>
        <a href="{{ url_for('budgets') }}"{% if request.endpoint == 'budgets' %} aria-current="page"{% endif %}>Budgets</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='background.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
