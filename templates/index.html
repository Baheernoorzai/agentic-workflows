<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expense Tracker</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #ddd; }
    .error { color: #b00020; }
    .num { text-align: right; }
  </style>
</head>
<body>
  <h1>Expense Tracker</h1>
  <p><a href="{{ url_for('report') }}">Monthly report</a></p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" action="{{ url_for('add') }}">
    <input name="amount" type="number" step="0.01" placeholder="Amount" required>
    <input name="category" placeholder="Category" required>
    <input name="date" type="date" required>
    <input name="note" placeholder="Note (optional)">
    <button type="submit">Add expense</button>
  </form>

  <h2>Total: {{ total }}</h2>

  <table>
    <thead>
      <tr><th>Date</th><th>Category</th><th class="num">Amount</th><th>Note</th></tr>
    </thead>
    <tbody>
      {% for e in expenses %}
      <tr>
        <td>{{ e.date }}</td>
        <td>{{ e.category }}</td>
        <td class="num">{{ e.amount }}</td>
        <td>{{ e.note or "" }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">No expenses yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
